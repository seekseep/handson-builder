services:
  app:
    # 規則: handson-<repo>-<section>-<lecture>（docker ps で識別しやすくする）
    container_name: __CONTAINER_NAME__
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /workspace/app
        - action: sync+restart
          path: ./scripts
          target: /workspace/scripts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./Dockerfile

  db:
    image: postgres:17
    container_name: __CONTAINER_NAME__-db
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
